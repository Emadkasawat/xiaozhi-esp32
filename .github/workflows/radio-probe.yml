name: Radio probe
on:
  push:
    branches: [radio-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search radio-browser and test streams
        run: |
          api=https://de1.api.radio-browser.info/json/stations
          fmt='.[] | "\(.votes)|\(.codec)|\(.bitrate)|\(.countrycode)|\(.name)|\(.url_resolved)"'
          echo "=== EG top"
          curl -s -G -A probe "$api/search" -d countrycode=EG -d hidebroken=true -d order=votes -d reverse=true -d limit=80 | jq -r "$fmt" | tee -a list.txt
          for q in "Monte Carlo" "MCD" "DW" "Deutsche Welle" "Al Arabiya" "Arabiya" "Sharq" "Middle East Radio" "Egypt" "Misr" "Cairo" "Quran"; do
            echo "=== $q"
            curl -s -G -A probe "$api/search" --data-urlencode "name=$q" -d hidebroken=true -d order=votes -d reverse=true -d limit=10 | jq -r "$fmt" | tee -a list.txt
          done
          echo "##### TESTS"
          cut -d'|' -f6 list.txt | sort -u > urls.txt
          while read -r u; do
            r=$(curl -s -m 8 -A probe -L -o /dev/null -D hdr.txt -w '%{http_code} %{url_effective}' --max-filesize 1 "$u" < /dev/null)
            ct=$(grep -i '^content-type' hdr.txt | tail -1 | tr -d '\r')
            echo "T|$r|$ct|$u"
          done < urls.txt
